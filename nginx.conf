server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compressão para assets textuais.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;

  # Se arquivos .gz pré-comprimidos existirem no build, o Nginx serve direto.
  gzip_static on;

  # Assets do Vite têm hash no nome, então podem ficar em cache imutável.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Arquivos públicos sem hash no nome: cache longo, mas não imutável.
  location ~* \.(?:ico|jpg|jpeg|png|gif|webp|avif|svg|woff|woff2|ttf|otf|eot)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # HTML não deve ficar preso em cache antigo após deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Fallback para SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
